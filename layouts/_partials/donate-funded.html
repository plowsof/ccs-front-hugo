{{- /* A Funding Required proposal at its goal: the amount raised, a full bar, and "Funded".
   ccs-front-bash puts this in place of the donation box.
   The gate takes it only with the bar at 100. */ -}}
<p class="progress-label">Raised <strong>{{ .raised }}</strong> of {{ .amount }} XMR<span class="pending">{{ .pending_note }}</span></p>
<progress max="100" value="{{ .percentage }}" aria-label="{{ .percentage }}% funded">{{ .percentage }}%</progress>
<div class="contribute"><span class="button primary funded">Funded</span></div>
