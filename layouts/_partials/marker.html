{{- /* An HTML comment ccs-front-bash finds: "list fr" -> <!-- ccs:list fr -->, "/list fr" -> <!-- /ccs:list fr -->.
   (html/template would drop a literal one.) */ -}}
{{- if strings.HasPrefix . "/" }}{{ printf "<!-- /ccs:%s -->" (strings.TrimPrefix "/" .) | safeHTML }}
{{- else }}{{ printf "<!-- ccs:%s -->" . | safeHTML }}{{ end -}}
