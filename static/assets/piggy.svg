    <circle cx="46" cy="46" r="38" fill="#f3d27a"/>
    <circle cx="46" cy="46" r="31" fill="#f7df9a"/>
    <path d="M27 62V32l19 19 19-19v30" fill="none" stroke="#ddb244" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
