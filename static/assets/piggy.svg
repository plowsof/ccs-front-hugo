<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-label="A piggy bank with two Monero coins dropping in">
  <!-- tail -->
  <path d="M62 200c-20-4-34 6-30 18 4 10 18 8 18-2 0-10-14-14-22-6" fill="none" stroke="#e8606b" stroke-width="9" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="112" y="268" width="46" height="62" rx="12" fill="#ef7f82"/>
  <rect x="248" y="268" width="46" height="62" rx="12" fill="#ef7f82"/>
  <!-- body -->
  <ellipse cx="200" cy="220" rx="150" ry="100" fill="#f08486"/>
  <!-- ear -->
  <path d="M260 134l46-42 8 70z" fill="#f08486"/>
  <path d="M272 132l30-26 4 42z" fill="#e8606b"/>
  <!-- snout -->
  <ellipse cx="342" cy="232" rx="32" ry="38" fill="#f08486"/>
  <!-- eye, smile -->
  <path d="M286 218q12 14 24 0" fill="none" stroke="#e8606b" stroke-width="8" stroke-linecap="round"/>
  <!-- coin slot -->
  <path d="M146 150q46-26 104-16" fill="none" stroke="#4c4c4c" stroke-width="9" stroke-linecap="round"/>
  <!-- coins -->
  <g transform="translate(150,40)">
    <circle cx="44" cy="44" r="44" fill="#e9c35a"/>
    <circle cx="44" cy="44" r="34" fill="#f6dd8f"/>
    <path d="M24 60V30l20 20 20-20v30" fill="none" stroke="#e9b938" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <g transform="translate(258,6)">
    <circle cx="32" cy="32" r="32" fill="#e9c35a"/>
    <circle cx="32" cy="32" r="25" fill="#f6dd8f"/>
    <path d="M17 44V22l15 15 15-15v22" fill="none" stroke="#e9b938" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
