  <!-- legs, the far ones a shade darker -->
  <rect x="150" y="276" width="44" height="72" rx="14" fill="#e86f75"/>
  <rect x="286" y="276" width="44" height="72" rx="14" fill="#e86f75"/>
  <rect x="104" y="282" width="50" height="78" rx="15" fill="#f08487"/>
  <rect x="244" y="282" width="50" height="78" rx="15" fill="#f08487"/>
  <!-- body -->
  <path d="M60 230c0-72 70-128 166-128 74 0 128 30 150 82 22 4 34 20 34 42s-14 40-36 42c-20 54-78 86-150 86-96 0-164-52-164-124z" fill="#f08487"/>
