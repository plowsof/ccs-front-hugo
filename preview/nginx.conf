# A preview's nginx (Dockerfile): as the real web server's (ccs-bash's docs/two-machines.md),
# with the theme in the address: /dark/… and /light/… are the same files with another theme.css,
# and ?theme=light|dark|system sends the page there.
map $request_uri $ccs_page {
    ~^/(?:dark|light)(/[^?]*) $1;
    ~^([^?]*)                 $1;
}
server {
    listen 8080;
    root /site;
    index index.html;
    disable_symlinks on;
    absolute_redirect off;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'" always;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
    if ($arg_theme = light)  { return 302 /light$ccs_page; }
    if ($arg_theme = dark)   { return 302 /dark$ccs_page; }
    if ($arg_theme = system) { return 302 $ccs_page; }
    location = /dark/assets/theme.css  { alias /site/assets/theme-dark.css; }
    location = /light/assets/theme.css { alias /site/assets/theme-light.css; }
    location ^~ /dark/  { alias /site/; try_files $uri $uri/ =404; }
    location ^~ /light/ { alias /site/; try_files $uri $uri/ =404; }
    location / { try_files $uri $uri/ =404; }
}
