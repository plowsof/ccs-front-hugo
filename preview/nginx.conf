# A preview's nginx (Dockerfile): as the real web server's (ccs-bash's docs/two-machines.md),
# with the theme in the address: /dark/… and /light/… are the same files with another theme.css,
# and ?theme=light|dark|system sends the page there.
# Never an address starting // or /\ (\x5c: nginx reads \\ itself), which a browser reads as another
# site's: with absolute_redirect off (below), ?theme=system on //evil.example/ would send it there.
map $request_uri $ccs_page {
    ~^/(?:dark|light)(/(?:[^/?\x5c][^?]*)?)(?:\?|$) $1;
    ~^(/(?:[^/?\x5c][^?]*)?)(?:\?|$)               $1;
    default                                      /;
}
server {
    listen 8080;
    root /site;
    index index.html;
    disable_symlinks on;
    absolute_redirect off;   # behind Coolify's proxy: its own host and port would be wrong
    server_tokens off;
    # the web server's security headers (ccs-bash's docs/two-machines.md), but HSTS: Coolify's proxy
    # serves the previews' HTTPS
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;
    if ($arg_theme = light)  { return 302 /light$ccs_page; }
    if ($arg_theme = dark)   { return 302 /dark$ccs_page; }
    if ($arg_theme = system) { return 302 $ccs_page; }
    location = /dark/assets/theme.css  { alias /site/assets/theme-dark.css; }
    location = /light/assets/theme.css { alias /site/assets/theme-light.css; }
    location ^~ /dark/  { alias /site/; try_files $uri $uri/ =404; }
    location ^~ /light/ { alias /site/; try_files $uri $uri/ =404; }
    # the example feed (preview/feed.xml): its {{site}} this preview's own address, so its items open
    # its pages (Coolify's proxy holds the TLS: the address is https whatever this nginx sees)
    location = /feed.xml {
        sub_filter "{{site}}" "https://$host";
        sub_filter_once off;
        sub_filter_types text/xml application/rss+xml;
    }
    location / { try_files $uri $uri/ =404; }
}
