# ccs-front-html: the CCS site's design, built offline by Hugo into public/, the "original"
# that ccs-front-bash copies and fills in on the backend. No JavaScript anywhere.
baseURL = "https://ccs.getmonero.org/"
languageCode = "en"
title = "Monero CCS"
relativeURLs = true
uglyURLs = true
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt", "404"]

[markup.goldmark.renderer]
  unsafe = false   # raw HTML in Markdown is dropped, never passed through

[params]
  frontendRepo = "https://repo.getmonero.org/monero-project/ccs-front"
  backendRepo = "https://github.com/plowsof/ccs-bash"
  proposalsRepo = "https://repo.getmonero.org/monero-project/ccs-proposals"
  submitIdea = "https://repo.getmonero.org/monero-project/ccs-proposals/-/merge_requests/new"
