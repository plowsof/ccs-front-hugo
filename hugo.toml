# ccs-front-html: the CCS site's design, built offline by Hugo into public/, the "original"
# that ccs-front-bash copies and fills in on the backend. No JavaScript anywhere.
baseURL = "https://ccs.getmonero.org/"
locale = "en"
title = "Monero CCS"
relativeURLs = true
uglyURLs = false
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt"]

[markup.goldmark.renderer]
  unsafe = false   # raw HTML in Markdown is dropped, never passed through

[params]
  frontendRepo = "https://repo.getmonero.org/monero-project/ccs-front"
  backendRepo = "https://github.com/plowsof/ccs-bash"
  proposalsRepo = "https://repo.getmonero.org/monero-project/ccs-proposals"
  generalFund = "888tNkZrPN6JsEgekjMnABU4TBzc2Dt29EPAvkRxbANsAnjyPbb3iQ1YBRk1UXcdRsiKc9dhwMVgN5S9cQUiyoogDavup3H"
  submitIdea = "https://repo.getmonero.org/monero-project/ccs-proposals/-/merge_requests/new"

# The signed list of the wallet's donation subaddresses (ccs-front-bash's tools/): the list's
# sha256 and the fingerprint of the throwaway key that signed it, from sign-subaddresses.sh,
# with its public key as static/assets/subaddresses-key.asc. Set, ccs-front-bash refuses any
# donation address not in that list and publishes the list; empty, there is no check.
[params.subaddresses]
  # the testnet CCS's list (100,000 subaddresses of account 0), signed 2026-10-23
  sha256 = "d30ea3afd88d8ff0f3f5e43d74b612c71a1311b7b19c41a8f4ae7bead486d8f2"
  key = "3CB930B311B490808775A4C9290C5085B75F4D61"
