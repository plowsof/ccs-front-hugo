# The CCS site's design. Hugo builds it into public/, the original that ccs-front-bash fills in.
# No JavaScript anywhere.
baseURL = "https://ccs.getmonero.org/"
locale = "en"
title = "Monero CCS"
relativeURLs = true
uglyURLs = false
disableKinds = ["taxonomy", "term", "section", "rss", "sitemap", "robotstxt"]

# A preview's commit line reads Coolify's variables.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^SOURCE_COMMIT$', '^COOLIFY_BRANCH$']

[markup.goldmark.renderer]
  unsafe = false   # raw HTML in Markdown is dropped

[params]
  designRepo = "https://github.com/plowsof/ccs-front-hugo"      # this site's design (Hugo, built offline)
  builderRepo = "https://github.com/plowsof/ccs-front-bash"     # fills it on the backend
  backendRepo = "https://github.com/plowsof/ccs-bash"
  proposalsRepo = "https://repo.getmonero.org/monero-project/ccs-proposals"
  generalFund = "888tNkZrPN6JsEgekjMnABU4TBzc2Dt29EPAvkRxbANsAnjyPbb3iQ1YBRk1UXcdRsiKc9dhwMVgN5S9cQUiyoogDavup3H"
  submitIdea = "https://repo.getmonero.org/monero-project/ccs-proposals/-/merge_requests/new"

