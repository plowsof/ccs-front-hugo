name: preview
# The previews and this comment: a task plowsof worked on for months, picked up and finished by
# ofrnxmr. Thank you.
# On a pull request, comment the link to its preview at https://ccs-<PR>.beta.monerodevs.org.
# Then wait until the preview serves this push's commit, and say it is live.
# After 15 minutes without it, say it isn't.
# One comment per PR, edited on every push. A newer push cancels the older wait.
# When the PR is merged or closed, the comment says the preview is offline.
# It checks out nothing and runs none of the PR's code, so pull_request_target is safe.
# A PR from a fork is untrusted, so its preview waits for a maintainer to read it.
# The maintainer deploys it by hand in Coolify, then runs this workflow with the PR number.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:   # after deploying a fork's preview by hand
    inputs:
      pr:
        description: Pull request number
        required: true
permissions:
  pull-requests: write
concurrency:   # a new push stops the wait for the old one
  group: preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          ACTION: ${{ github.event.action }}
          SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
          # A fork: the head repository isn't this one. A run by hand means a maintainer deployed it.
          FORK: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          [[ $PR =~ ^[0-9]+$ ]] || { echo "error: not a PR number: $PR" >&2; exit 1; }
          if [[ $FORK == true && $ACTION != closed ]]; then
              [[ $ACTION == opened ]] && gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Thank you! A preview of this pull request is built once a maintainer has read it: it is code from a fork, and previews run on the CCS's own machines. The link will follow here."
              exit 0
          fi
          [[ $SHA ]] || SHA=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "error: not a commit: $SHA" >&2; exit 1; }
          url=https://ccs-$PR.beta.monerodevs.org
          api=repos/$GITHUB_REPOSITORY/issues
          # Find the comment by its hidden first line, or by older forms of it. Only this bot's.
          # body STATUS [offline]. Offline shows the preview without its link.
          body() {
              local preview="[Preview #$PR]($url)"
              [[ ${2:-} ]] && preview="Preview #$PR"
              printf '<!-- ccs-preview -->\n|What|Link|\n|:---:|---|\n|🕵️‍♂️ Review|[Files changed](https://github.com/%s/pull/%s/files)|\n|🌐 Deploy|%s %s|\n' \
                  "$GITHUB_REPOSITORY" "$PR" "$preview" "$1"
          }
          say() { gh api -X PATCH "$api/comments/$id" -f body="$(body "$1")" > /dev/null; }
          id=$(gh api --paginate "$api/$PR/comments" --jq '.[] | select(.user.login == "github-actions[bot]")
              | select(.body | startswith("<!-- ccs-preview -->") or startswith("|What|Link|") or startswith("Thank you! A preview of this pull request")) | .id' | tail -n 1)
          # Merged or closed: the preview is gone. A fork's note stays.
          if [[ $ACTION == closed ]]; then
              [[ $id ]] && gh api "$api/comments/$id" --jq .body | grep -q '^<!-- ccs-preview -->' || exit 0
              gh api -X PATCH "$api/comments/$id" -f body="$(body "⚫ offline: the pull request was $([[ $MERGED == true ]] && echo merged || echo closed)" offline)" > /dev/null
              exit 0
          fi
          if [[ $id ]]; then say "🟡 building \`${SHA::7}\`…"
          else id=$(gh api "$api/$PR/comments" -f body="$(body "🟡 building \`${SHA::7}\`…")" --jq .id); fi
          # Live: the preview answers, and its banner links this commit.
          end=$((SECONDS + 15 * 60))
          until curl -fsS --max-time 20 "$url/" 2> /dev/null | grep -q "/changes/$SHA\""; do
              if ((SECONDS >= end)); then
                  say "🔴 not live after 15 minutes (\`${SHA::7}\`): see Coolify"
                  exit 0
              fi
              sleep 20
          done
          say "🟢 live (\`${SHA::7}\`)"
