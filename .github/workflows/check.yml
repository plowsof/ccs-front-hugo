name: check
# The site's zip is reproducible: built at once on two machines (the second from a clone made under
# umask 077), the two must be the same, byte for byte. Once per change: PRs and pushes to master.
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  zip:
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - id: build
        name: build (StageX images, signatures checked, no network)
        run: |
          container/build.sh dist | tee /tmp/sum
          echo "sha256=$(cut -d' ' -f1 /tmp/sum)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by commit
        with:
          name: ccs-front-hugo-zip
          path: dist/ccs-front-hugo.zip
  zip-again:
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit
      - id: build
        name: build again, another machine, a clone made under umask 077
        run: |
          (umask 077 && git clone -q "$PWD" "$RUNNER_TEMP/clone")
          "$RUNNER_TEMP/clone/container/build.sh" "$RUNNER_TEMP/out" | tee /tmp/sum
          echo "sha256=$(cut -d' ' -f1 /tmp/sum)" >> "$GITHUB_OUTPUT"
  reproducible:
    needs: [zip, zip-again]
    runs-on: ubuntu-24.04
    steps:
      - name: the same zip on both machines
        env:
          A: ${{ needs.zip.outputs.sha256 }}
          B: ${{ needs.zip-again.outputs.sha256 }}
        run: |
          echo "first machine:  $A"; echo "second machine: $B"
          [[ ${#A} == 64 && $A == "$B" ]] || { echo "error: the two zips differ, or one is missing" >&2; exit 1; }
          echo "reproducible: commit ${GITHUB_SHA::7} zips to sha256 $A"
