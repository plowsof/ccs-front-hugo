<!doctype html>
<!-- The link-preview card, 1200x630. tools/icons-png.sh renders it to assets/assets/card.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "DM Sans"; src: url("../assets/assets/fonts/dm-sans-latin.woff2") format("woff2"); font-weight: 100 1000; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body {
  font-family: "DM Sans", sans-serif; background: #ffffff; color: #2e3038;
  display: flex; align-items: center; gap: 40px; padding: 0 80px; box-sizing: border-box;
  border-bottom: 16px solid #e2611f;
}
.text { flex: 1; }
.brand { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; color: #191b23; }
.brand img { width: 64px; height: 64px; }
h1 { margin: 36px 0 24px; font-size: 76px; line-height: 1.05; font-weight: 800; color: #b24b17; letter-spacing: -1px; }
p { margin: 0; font-size: 32px; line-height: 1.35; color: #5c5e67; }
.piggy { width: 400px; height: 400px; }
</style>
</head>
<body>
<div class="text">
  <div class="brand"><img src="../assets/assets/icons/logo-3x.png" alt="">Monero CCS</div>
  <h1>Community Crowdfunding System</h1>
  <p>Fund Monero development and other work for the ecosystem, in XMR.</p>
</div>
<img class="piggy" src="../assets/assets/piggy-760.avif" alt="">
</body>
</html>
