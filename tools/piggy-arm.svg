  <rect x="1404" y="912" width="70" height="66" rx="20" fill="#f3c7a1"/>
  <path d="M1410 932 L1458 932 M1410 950 L1460 950 M1412 966 L1456 966" stroke="#d99a74" stroke-width="5" stroke-linecap="round"/>
  <!-- thumb up -->
  <rect x="1446" y="852" width="28" height="74" rx="14" fill="#f3c7a1"/>
  <path d="M1452 862 L1468 862" stroke="#e7a57f" stroke-width="5" stroke-linecap="round"/>
